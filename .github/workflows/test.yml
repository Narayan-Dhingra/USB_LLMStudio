name: tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      # The regression tests import app/frontend/src/services/api.js, which
      # resolves frontend dependencies, so install them first.
      - name: Install frontend dependencies
        working-directory: app/frontend
        run: npm ci

      - name: Run tests
        run: npm test
